[book]
authors = ["Alexander Golys"]
language = "en"
src = "docs"
title = "These Macros Should Be Illegal"

[build]
build-dir = "target/book"
create-missing = false

[preprocessor.tsitter]
after = ["links"]

[preprocessor.tsitter.languages.rust]
library = "book/parsers/rust.so"
highlights = "book/queries/rust/highlights.scm"

[preprocessor.tsitter.languages.bash]
library = "book/parsers/bash.so"
highlights = "book/queries/bash/highlights.scm"
aliases = ["bash", "sh", "shell"]

[output.html]
git-repository-url = "https://github.com/AlexanderGolys/these-macros-should-be-illegal"
theme = "book/theme"
additional-css = [
    "book/theme/treesitter.css",
    "book/theme/everforest.css",
]

[rust]
edition = "2024"

# The playground cannot load this crate, so blocks using its macros cannot run
# there. Only plain-Rust blocks opt in, with the `mdbook-runnable` annotation.
[output.html.playground]
runnable = false
editable = true
